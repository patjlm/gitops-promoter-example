name: CI Checks

on:
  pull_request:
    branches:
      - environment/development
      - environment/integration
      - environment/stage
      - environment/prod-1
      - environment/prod-2
      - environment/prod-3
  push:
    branches:
      - environment/development
      - environment/integration
      - environment/stage
      - environment/prod-1
      - environment/prod-2
      - environment/prod-3

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect component
        id: detect
        run: |
          # On PR: use source branch name to identify component (most reliable)
          # Source branch pattern: environment/<env>-next/apps/<component> or environment/<env>-next/infra/<component>
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            SOURCE_BRANCH="${GITHUB_HEAD_REF}"
            COMPONENT_PATH=$(echo "$SOURCE_BRANCH" | sed 's|environment/[^/]*-next/||')
            COMPONENT=$(echo "$COMPONENT_PATH" | cut -d/ -f2)
            if echo "$COMPONENT_PATH" | grep -q "^apps/"; then
              echo "type=k8s" >> "$GITHUB_OUTPUT"
            elif echo "$COMPONENT_PATH" | grep -q "^infra/"; then
              echo "type=terraform" >> "$GITHUB_OUTPUT"
            else
              echo "type=unknown" >> "$GITHUB_OUTPUT"
            fi
          else
            # On push to active branch: detect from changed files (HEAD~1 vs HEAD)
            changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-tree -r --name-only HEAD)
            if echo "$changed" | grep -q "^apps/app-a/"; then
              COMPONENT="app-a"; echo "type=k8s" >> "$GITHUB_OUTPUT"
            elif echo "$changed" | grep -q "^apps/app-b/"; then
              COMPONENT="app-b"; echo "type=k8s" >> "$GITHUB_OUTPUT"
            elif echo "$changed" | grep -q "^apps/app-c/"; then
              COMPONENT="app-c"; echo "type=k8s" >> "$GITHUB_OUTPUT"
            elif echo "$changed" | grep -q "^apps/app-d/"; then
              COMPONENT="app-d"; echo "type=k8s" >> "$GITHUB_OUTPUT"
            elif echo "$changed" | grep -q "^infra/infra-e/"; then
              COMPONENT="infra-e"; echo "type=terraform" >> "$GITHUB_OUTPUT"
            else
              COMPONENT="unknown"; echo "type=unknown" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BRANCH="${GITHUB_BASE_REF}"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Set pending status
        if: steps.detect.outputs.component != 'unknown'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context="ci-check" \
            -f description="CI checks running for ${{ steps.detect.outputs.component }}"

      - name: Validate Kubernetes manifests
        if: steps.detect.outputs.type == 'k8s'
        run: |
          COMPONENT="${{ steps.detect.outputs.component }}"
          echo "Validating K8s manifests for $COMPONENT"
          FAILED=0
          for f in "apps/$COMPONENT"/*.yaml; do
            [ -f "$f" ] || continue
            [ "$(basename "$f")" = "hydrator.metadata" ] && continue
            echo "  Checking $f"
            # Fail if test-ci-fail annotation is present (simulates a CI validation failure)
            if grep -q 'test-ci-fail: "true"' "$f" 2>/dev/null; then
              echo "  ERROR: test-ci-fail annotation found in $f — manifest marked as failing CI"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "One or more manifests failed validation"
            exit 1
          fi

      - name: Setup Terraform
        if: steps.detect.outputs.type == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9

      - name: Terraform validate
        if: steps.detect.outputs.type == 'terraform'
        run: |
          cd infra/infra-e
          terraform init -backend=false
          terraform validate

      - name: Report CI success
        if: success() && steps.detect.outputs.component != 'unknown'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context="ci-check" \
            -f description="CI checks passed for ${{ steps.detect.outputs.component }}"

      - name: Report CI failure
        if: failure() && steps.detect.outputs.component != 'unknown'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context="ci-check" \
            -f description="CI checks failed for ${{ steps.detect.outputs.component }}"

      - name: Summary
        if: always()
        run: |
          echo "## CI Check Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Event:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** ${{ steps.detect.outputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Component:** ${{ steps.detect.outputs.component }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Type:** ${{ steps.detect.outputs.type }}" >> "$GITHUB_STEP_SUMMARY"
