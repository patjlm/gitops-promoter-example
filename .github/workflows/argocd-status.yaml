name: ArgoCD Status Report

# This workflow reports the ArgoCD sync status for ALL apps on EVERY commit,
# even if the commit doesn't affect those apps' manifests.
#
# This complements the reactive ArgoCD notifications which only fire when
# an app actually syncs.

on:
  push:
    branches:
      - argocd-notifications-example

permissions:
  statuses: write
  checks: write

jobs:
  report-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report Initial Status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Post "pending" status for all apps while we check ArgoCD
          for app in test-app test-app-2 all-apps; do
            gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
              -f state=pending \
              -f context="ArgoCD/${app}" \
              -f description="Checking ArgoCD sync status..." \
              -f target_url="https://argocd.example.com/applications/${app}"
          done

      - name: Check ArgoCD Status
        id: argocd
        run: |
          # In a real setup, this would query the ArgoCD API or cluster
          # For this demo, we'll simulate it

          echo "In production, this would:"
          echo "1. Query ArgoCD API for app sync/health status"
          echo "2. Check if apps are synced to this commit SHA: ${{ github.sha }}"
          echo "3. Report success/failure based on actual state"
          echo ""
          echo "For now, simulating success after a delay..."
          sleep 10

          # Simulate that all apps are synced
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Report Final Status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Post final status based on ArgoCD state
          STATE="${{ steps.argocd.outputs.status }}"

          for app in test-app test-app-2; do
            gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
              -f state="${STATE}" \
              -f context="ArgoCD/${app}" \
              -f description="App synced successfully" \
              -f target_url="https://argocd.example.com/applications/${app}"
          done

          # Aggregate status
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state="${STATE}" \
            -f context="ArgoCD/all-apps-proactive" \
            -f description="All apps synced successfully" \
            -f target_url="https://argocd.example.com/applications/all-apps"
