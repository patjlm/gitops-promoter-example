apiVersion: batch/v1
kind: Job
metadata:
  name: slow-job
  namespace: default
spec:
  # Automatically delete job after completion
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      # Add hash of spec to pod name so each Job update creates new pods
      labels:
        job: slow-job
    spec:
      containers:
      - name: sleeper
        image: busybox:latest
        command: ["sh", "-c", "echo 'Starting slow job'; sleep 30; echo 'Job complete'"]
      restartPolicy: Never
  backoffLimit: 0
