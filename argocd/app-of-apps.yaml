apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: all-apps
  namespace: argocd
  annotations:
    # This parent app aggregates the sync status of all child apps
    # Uses the same template as child apps - label will be ArgoCD/all-apps
    notifications.argoproj.io/subscribe.on-sync-status-change.github: ""
spec:
  project: default
  source:
    repoURL: https://github.com/patjlm/gitops-promoter-example.git
    targetRevision: argocd-notifications-example
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
