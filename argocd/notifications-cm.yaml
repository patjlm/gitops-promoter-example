apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # For comprehensive reference on Application status structure, timestamps,
  # and oncePer key design, see ../Application-status.md

  # GitHub service configuration using GitHub App
  service.github: |
    appID: $github-app-id
    installationID: $github-installation-id
    privateKey: $github-app-private-key

  # Commit status templates (check runs are broken in ArgoCD v3.4.4)
  template.github-status-pending: |
    message: |
      Phase: {{.app.status.operationState.phase}} | Sync: {{.app.status.sync.status}} | Health: {{.app.status.health.status}}
    github:
      repoURLPath: "{{.app.spec.source.repoURL}}"
      revisionPath: "{{.app.status.sync.revision}}"
      status:
        state: pending
        label: "ArgoCD/{{.app.metadata.name}}"
        targetURL: "https://argocd.example.com/applications/{{.app.metadata.name}}"

  template.github-status-success: |
    message: |
      Phase: {{.app.status.operationState.phase}} | Sync: {{.app.status.sync.status}} | Health: {{.app.status.health.status}}
    github:
      repoURLPath: "{{.app.spec.source.repoURL}}"
      revisionPath: "{{.app.status.sync.revision}}"
      status:
        state: success
        label: "ArgoCD/{{.app.metadata.name}}"
        targetURL: "https://argocd.example.com/applications/{{.app.metadata.name}}"

  template.github-status-failure: |
    message: |
      Phase: {{.app.status.operationState.phase}} | Sync: {{.app.status.sync.status}} | Health: {{.app.status.health.status}}
    github:
      repoURLPath: "{{.app.spec.source.repoURL}}"
      revisionPath: "{{.app.status.sync.revision}}"
      status:
        state: failure
        label: "ArgoCD/{{.app.metadata.name}}"
        targetURL: "https://argocd.example.com/applications/{{.app.metadata.name}}"

  # Triggers - improved oncePer keys to handle oscillation
  # See Application-status.md for detailed explanation of status domains and oncePer design

  trigger.on-sync-running: |
    # Fires when sync operation starts
    # oncePer uses sync.revision (not syncResult.revision) to match what's reported to GitHub
    - when: app.status.operationState != nil and app.status.operationState.phase in ['Running']
      oncePer: app.status.sync.revision + "-" + app.status.operationState?.startedAt
      send: [github-status-pending]

  trigger.on-deployed: |
    # Fires when sync succeeds AND health is confirmed
    # The timestamp logic ensures health became Healthy AFTER this sync started
    # oncePer uses sync.revision (not syncResult.revision) to match what's reported to GitHub
    - when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy' and (time.Parse(app.status.health.lastTransitionTime) >= time.Parse(app.status.operationState.startedAt))
      oncePer: app.status.sync.revision + "-" + app.status.operationState?.finishedAt
      send: [github-status-success]

  trigger.on-sync-failed: |
    # Fires when sync operation fails
    # oncePer uses finishedAt to capture each failure (even on retries of same revision)
    - when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
      oncePer: app.status.sync.revision + "-" + app.status.operationState?.finishedAt
      send: [github-status-failure]
