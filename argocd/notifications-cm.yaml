apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # GitHub service configuration using GitHub App
  service.github: |
    appID: $github-app-id
    installationID: $github-installation-id
    privateKey: $github-app-private-key

  # Single unified template for all apps (including all-apps)
  # GitHub status shows: label + message (no separate description field)
  template.github-status: |
    message: |
      phase={{.app.status.operationState.phase}} sync={{.app.status.sync.status}} health={{.app.status.health.status}}
    github:
      repoURLPath: "{{.app.spec.source.repoURL}}"
      revisionPath: "{{.app.status.sync.revision}}"
      status:
        state: "{{if eq .app.status.operationState.phase \"Running\"}}pending{{else if and (eq .app.status.sync.status \"Synced\") (eq .app.status.health.status \"Healthy\")}}success{{else}}failure{{end}}"
        label: "ArgoCD/{{.app.metadata.name}}"
        targetURL: "https://argocd.example.com/applications/{{.app.metadata.name}}"

  # Single trigger for all apps
  trigger.on-sync-status-change: |
    - when: app.status.operationState != nil
      oncePer: app.status.sync.revision + "-" + app.status.operationState.phase
      send: [github-status]
    - when: app.status.sync.status == "Synced" && app.status.health.status == "Healthy"
      oncePer: app.status.sync.revision
      send: [github-status]
