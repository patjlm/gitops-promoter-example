apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b
  annotations:
    test-ci-fail: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-b
  template:
    metadata:
      labels:
        app: app-b
    spec:
      containers:
        - name: app-b
          image: kennethreitz/httpbin:v1.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
